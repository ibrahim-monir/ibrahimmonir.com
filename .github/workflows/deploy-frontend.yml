name: Deploy Frontend to cPanel

# Mirrors upokoron's deploy.yml (github.com/ibrahim-monir/upokoron): a plain
# static export uploaded via the cPanel API, no SSH. The Next.js app builds
# with output: "export" specifically so there is no Node process to keep
# running on the server -- this cPanel box is shared with two live
# e-commerce sites, so the goal is the smallest possible footprint (a docroot
# full of static files), same as upokoron's frontend/dist.
#
# BEFORE TRUSTING THE PUSH TRIGGER:
#   1. Fill in CPANEL_USER and WEB_ROOT below (WEB_ROOT is the absolute path
#      to ibrahimmonir.com's document root, e.g. /home/USER/public_html or
#      /home/USER/domains/ibrahimmonir.com/public_html -- whichever hPanel
#      shows for this domain).
#   2. Add repo secret CPANEL_API_TOKEN (hPanel -> Security -> Manage API
#      Tokens -- create a fresh one for this repo even if upokoron already
#      has one; tokens aren't shared across repos).
#   3. Run this workflow once by hand (Actions tab -> Run workflow) and
#      check every step -- Extract in particular depends on WEB_ROOT being
#      exactly right, which nobody can verify from outside the account.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

env:
  CPANEL_HOST: premium.mywhiteserver.com
  CPANEL_USER: REPLACE_WITH_CPANEL_USERNAME
  # Absolute path to ibrahimmonir.com's document root on the server.
  WEB_ROOT: REPLACE_WITH_WEB_ROOT
  DOMAIN: https://ibrahimmonir.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Written into public/ so the static export picks it up as a plain
      # file at /build-info.json -- lets the Verify step below confirm this
      # exact commit is what's actually being served, the same way
      # upokoron's update.php reports build.json.
      - name: Write build info
        run: |
          printf '{"commit":"%s","built_at":"%s"}' \
            "$(git rev-parse --short HEAD)" \
            "$(date -u '+%Y-%m-%d %H:%M')" \
            > frontend/public/build-info.json

      - name: Build the static export
        working-directory: frontend
        run: npm run build

      - name: Assemble the deploy bundle
        id: assemble
        run: |
          set -euo pipefail
          cp frontend/public_html.htaccess frontend/out/.htaccess
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          cd frontend/out
          zip -r -q "$RUNNER_TEMP/deploy.zip" .
          echo "Bundle: $(du -h "$RUNNER_TEMP/deploy.zip" | cut -f1)"

      - name: Upload the bundle to cPanel
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f \
            -H "Authorization: cpanel ${CPANEL_USER}:${{ secrets.CPANEL_API_TOKEN }}" \
            -F "dir=/home/${CPANEL_USER}" \
            -F "file-1=@${RUNNER_TEMP}/deploy.zip;filename=deploy.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"failed":0' || { echo "::error::Upload reported a failure."; exit 1; }

      # NOTE: like upokoron, extraction has to go through the older cPanel
      # API 2 fileop call -- there is no current UAPI function for it. Paths
      # must be fully-qualified (relative "." is rejected as "resolves
      # outside your home directory"), and the response is HTTP 200 even on
      # failure, so the JSON body is checked explicitly below.

      - name: Extract on the server
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f \
            -H "Authorization: cpanel ${CPANEL_USER}:${{ secrets.CPANEL_API_TOKEN }}" \
            --get \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=extract" \
            --data-urlencode "sourcefiles=/home/${CPANEL_USER}/deploy.zip" \
            --data-urlencode "destfiles=${WEB_ROOT}" \
            --data-urlencode "doubledecode=1" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"result":1' || { echo "::error::Extraction failed -- see the response above. Check that WEB_ROOT matches ibrahimmonir.com's document root exactly."; exit 1; }

      - name: Remove the uploaded zip
        continue-on-error: true
        run: |
          curl -sS \
            -H "Authorization: cpanel ${CPANEL_USER}:${{ secrets.CPANEL_API_TOKEN }}" \
            --get \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=unlink" \
            --data-urlencode "sourcefiles=/home/${CPANEL_USER}/deploy.zip" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel"

      - name: Verify the live build matches this commit
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f "${DOMAIN}/build-info.json")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "${{ steps.assemble.outputs.commit }}" || {
            echo "::error::The live site still does not report commit ${{ steps.assemble.outputs.commit }}. The deploy did not actually land -- check the Extract step above."
            exit 1
          }
          echo "Confirmed: production is now running ${{ steps.assemble.outputs.commit }}."
